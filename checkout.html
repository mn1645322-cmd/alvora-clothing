<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إتمام الطلب | ALVORA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <a href="index.html" class="logo">
        ALVORA
    </a>

    <a href="index.html" class="shop-button">
        العودة للمتجر
    </a>

</header>


<main class="checkout-page">

    <div class="checkout-box">

        <h1>إتمام الطلب</h1>

        <p>
            أدخلي بياناتك لإتمام طلبك
        </p>


        <form id="checkout-form">

            <label for="name">
                الاسم بالكامل
            </label>

            <input
                type="text"
                id="name"
                placeholder="اكتبي اسمك"
                required
            >


            <label for="phone">
                رقم الهاتف
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="01xxxxxxxxx"
                required
            >


            <label for="address">
                العنوان
            </label>

            <textarea
                id="address"
                placeholder="المحافظة - المنطقة - الشارع - رقم المنزل"
                required
            ></textarea>


            <label for="notes">
                ملاحظات الطلب
            </label>

            <textarea
                id="notes"
                placeholder="أي ملاحظات إضافية (اختياري)"
            ></textarea>


            <h2>طريقة الدفع</h2>

            <div class="payment-options">

                <label>
                    <input
                        type="radio"
                        name="payment"
                        value="cash"
                        checked
                    >
                    الدفع عند الاستلام
                </label>

            </div>


            <button
                type="submit"
                class="checkout-submit">

                تأكيد الطلب

            </button>

        </form>

    </div>

</main>


<script src="checkout.js"></script>

</body>
</html>
