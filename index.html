<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ALVORA | متجر ملابس</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <a href="#" class="logo">ALVORA</a>

    <nav class="nav">
        <a href="#home">الرئيسية</a>
        <a href="#products">المنتجات</a>
        <a href="#categories">الأقسام</a>
    </nav>

    <button class="cart-button" onclick="openCart()">
        🛒 السلة
        <span id="cart-count">0</span>
    </button>

</header>


<main>

    <!-- الرئيسية -->
    <section id="home" class="hero">

        <div class="hero-content">

            <p>ALVORA COLLECTION</p>

            <h1>ستايلك يبدأ من هنا</h1>

            <p>
                ملابس وأحذية لكل إطلالاتك
            </p>

            <a href="#products" class="shop-button">
                تسوقي الآن
            </a>

        </div>

    </section>


    <!-- الأقسام -->
    <section id="categories" class="categories">

        <h2>الأقسام</h2>

        <div class="category-grid">

            <button onclick="filterProducts('all')">
                الكل
            </button>

            <button onclick="filterProducts('tshirt')">
                تيشيرتات
            </button>

            <button onclick="filterProducts('hoodie')">
                هودي
            </button>

            <button onclick="filterProducts('shirt')">
                قمصان
            </button>

            <button onclick="filterProducts('jacket')">
                جواكت
            </button>

            <button onclick="filterProducts('pants')">
                بنطلونات
            </button>

            <button onclick="filterProducts('shoes')">
                أحذية
            </button>

        </div>

    </section>


    <!-- المنتجات -->
    <section id="products" class="products">

        <h2>كل المنتجات</h2>

        <div id="products-grid" class="products-grid">

            <!-- المنتجات سيضيفها JavaScript هنا -->

        </div>

    </section>


    <!-- السلة -->
    <section id="cart" class="cart-section">

        <div class="cart-box">

            <h2>سلة المشتريات 🛒</h2>

            <div id="cart-items">
                <p>السلة فارغة</p>
            </div>

            <div class="cart-total">

                <span>الإجمالي</span>

                <strong id="cart-total">
                    0 جنيه
                </strong>

            </div>

            <button
                class="checkout-button"
                onclick="checkout()">

                إتمام الشراء

            </button>

        </div>

    </section>

</main>


<footer>

    <p>
        © 2026 ALVORA
    </p>

</footer>


<script src="script.js"></script>

</body>
</html>
