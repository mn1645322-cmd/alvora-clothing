
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALVORA Clothing</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#111;
            color:white;
        }

        header{
            background:#6b001b;
            padding:20px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        header h1{
            font-size:32px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 15px;
            font-size:18px;
        }

        nav a:hover{
            color:#ffd700;
        }

        .hero{
            text-align:center;
            padding:80px 20px;
            background:#000;
        }

        .hero h2{
            font-size:40px;
            margin-bottom:20px;
        }

        .hero p{
            font-size:20px;
            margin-bottom:30px;
        }

        .btn{
            background:#6b001b;
            color:white;
            border:none;
            padding:15px 35px;
            border-radius:8px;
            cursor:pointer;
            font-size:18px;
        }

        .btn:hover{
            background:#950028;
        }

        .products{
            padding:60px 20px;
            text-align:center;
        }

        .products h2{
            margin-bottom:30px;
        }

        .cards{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:25px;
        }

        .card{
            background:#222;
            width:260px;
            border-radius:10px;
            overflow:hidden;
        }

        .card img{
            width:100%;
            height:250px;
            object-fit:cover;
        }

        .card h3{
            margin-top:15px;
        }

        .price{
            color:#ffd700;
            margin:15px 0;
            font-size:20px;
        }

        select{
            width:90%;
            padding:10px;
            margin:10px;
        }

        .card button{
            width:90%;
            margin-bottom:20px;
        }

        footer{
            background:#6b001b;
            text-align:center;
            padding:20px;
            margin-top:50px;
        }
    </style>

</head>

<body>

<header>

<h1>ALVORA</h1>

<nav>

<a href="#">الرئيسية</a>
<a href="#">المنتجات</a>
<a href="#">السلة</a>
<a href="#">تواصل معنا</a>

</nav>

</header>

<section class="hero">

<h2>ALVORA CLOTHING</h2>

<p>Luxury Fashion Brand</p>

<button class="btn">تسوق الآن</button>

</section>

<section class="products">

<h2>منتجاتنا</h2>

<div class="cards">

<div class="card">

<img src="https://via.placeholder.com/260x250" alt="T-shirt">

<h3>تيشيرت</h3>

<p class="price">499 جنيه</p>

<select>

<option>اختر المقاس</option>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>

</select>

<select>

<option>اختر اللون</option>
<option>أسود</option>
<option>أبيض</option>
<option>نبيتي</option>

</select>

<button class="btn">أضف للسلة</button>

</div>

</div>

</section>

<footer>

<p>© 2026 ALVORA Clothing</p>

</footer>

</body>

</html>
